name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/model.test.js
      - name: Manifest is valid JSON
        run: python3 -m json.tool manifest.json > /dev/null
      - name: Install script syntax
        run: bash -n install.sh
